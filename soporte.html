
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte - VibePC</title>
    <link rel="icon" href="img/logo.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <header class="bg-dark text-white p-3">
        <section class="container d-flex justify-content-between align-items-center">
            <h2>VibePC</h2>
            <a href="index.html" class="btn btn-outline-light">Regresar</a>
        </section>
    </header>

    <main class="container mt-5 mb-5">
        <section class="row justify-content-center">
            <section class="col-md-8 col-lg-6">

                <article class="card shadow">
                    <section class="card-header bg-primary text-white text-center">
                        <h3>Soporte Técnico</h3>
                        <p>¿Necesitas ayuda? Contáctanos</p>
                    </section>

                    <section class="card-body">
                        <form action="#" method="post">

                            <section class="mb-3">
                                <label for="nombre" class="form-label">Nombre completo:</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
                            </section>

                            <section class="mb-3">
                                <label for="correo" class="form-label">Correo electrónico:</label>
                                <input type="email" class="form-control" id="correo" name="correo" placeholder="ejemplo@gmail.com" required>
                            </section>

                            <section class="mb-3">
                                <label for="telefono" class="form-label">Número de teléfono:</label>
                                <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Ingresa tu teléfono">
                            </section>

                            <section class="mb-3">
                                <label for="problema" class="form-label">Tipo de problema:</label>
                                <select class="form-select" id="problema" name="problema" required>
                                    <option value="">Selecciona una opción</option>
                                    <option value="pedido">Problema con pedido</option>
                                    <option value="producto">Problema con producto</option>
                                    <option value="pago">Problema con pago</option>
                                    <option value="envio">Problema con envío</option>
                                    <option value="cuenta">Problema con cuenta</option>
                                    <option value="otro">Otro problema</option>
                                </select>
                            </section>

                            <section class="mb-3">
                                <label for="mensaje" class="form-label">Describe tu problema:</label>
                                <textarea class="form-control" id="mensaje" name="mensaje" rows="5" placeholder="Escribe aquí tu problema..." required></textarea>
                            </section>

                            <section class="mb-3">
                                <label for="archivo" class="form-label">Adjuntar imagen (opcional):</label>
                                <input type="file" class="form-control" id="archivo" name="archivo" accept="image/*">
                            </section>

                            <section class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="terminos" required>
                                <label class="form-check-label" for="terminos">
                                    Acepto que mis datos sean utilizados para atender mi solicitud.
                                </label>
                            </section>

                            <section class="d-grid">
                                <button type="submit" class="btn btn-primary">Enviar solicitud</button>
                            </section>

                        </form>
                    </section>

                    <section class="card-footer text-center">
                        <p class="mb-0 text-muted">Gracias por contactar a VibePC</p>
                    </section>
                </article>

            </section>
        </section>
    </main>

</body>
</html>
