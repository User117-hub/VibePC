<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito</title>
    <link rel="icon" href="img/logo.ico" type="image/x-icon"/>
    <link href="css/carrito.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>

    <header>
    <details>
        <summary>
            <span class="material-symbols-outlined">menu</span>
        </summary>
        <nav class="menu_lateral">
            <ul>
                <li><a class="nav-link" href="AdminProductos.html">Productos</a></li>
                <li><a class="nav-link" href="AdminClientes.html">Clientes</a></li>
                <li><a class="nav-link" href="AdminVentas.html">Ventas</a></li>
                <li><a class="nav-link" href="AdminDetallesVent.html">Detalle ventas</a></li>
                <li><a href="index.html">Cerrar sesión</a></li>
            </ul>
    </nav>
</details>

<img src="img/logo.png" width="150" height="50" alt="Logo">

<section class="iconos">
    <a href="carrito.html">
        <span class="material-symbols-outlined">shopping_cart</span>
    </a>
    <a href="login.html">
        <span class="material-symbols-outlined">account_circle</span>
    </a>
</section>
</header>


    <main class="contenedor-carrito">

        <h1>Carrito de compras</h1>

        <section class="contenido-carrito">

            <section class="productos">

                <article class="producto-carrito">

                    <img src="img/producto1.png" alt="Computadora Gamer">

                    <section class="informacion-producto">

                        <h2>Computadora Gamer Alchemy Force</h2>

                        <p class="precio">$50,766.00</p>

                        <section class="cantidad-container">
                            <label for="cantidad">Cantidad:</label>

                            <article class="control-cantidad">
                                <button type="button">-</button>
                                <span>1</span>
                                <button type="button">+</button>
                            </article>
                        </section>

                        <button class="btn-eliminar">
                            Eliminar
                        </button>

                    </section>

                </article>

            </section>


            <aside class="resumen-carrito">

                <h2>Resumen del pedido</h2>

                <section class="resumen">

                    <p>
                        <span>Subtotal:</span>
                        <strong>$50,766.00</strong>
                    </p>

                    <p>
                        <span>Envío:</span>
                        <strong>$1,500</strong>
                    </p>

                    <p class="total">
                        <span>Total:</span>
                        <strong>$50,766.00</strong>
                    </p>

                </section>

                <button class="btn-comprar">
                    Continuar compra
                </button>

            </aside>

        </section>

    </main>

</body>
</html>
