<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibePC - Iniciar Sesión</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .contenedor {
            display: flex;
            width: 100%;
            height: 100vh;
        }
        .imagen {
            width: 50%;
            height: 100vh;
            background-image: url("gaming.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        .login {
            width: 50%;
            height: 100vh;
            background-color: #eef8ff;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 135px 40px 40px;
        }
        .logo {
            font-size: 62px;
            font-weight: bold;
            color: #3184d7;
            margin-bottom: 95px;
            letter-spacing: -3px;
        }

        .logo span {
            font-weight: normal;
        }
        .formulario {
            width: 100%;
            max-width: 555px;
        }

        .grupo {
            width: 100%;
            margin-bottom: 35px;
        }

        .grupo label {
            display: block;
            font-size: 27px;
            font-weight: 500;
            color: #0b3c70;
            margin-bottom: 3px;
        }

        .input-contenedor {
            position: relative;
            width: 100%;
        }

        .input-contenedor input {
            width: 100%;
            height: 50px;

            border: 1px solid #222;
            border-radius: 3px;

            padding: 0 15px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        .input-contenedor input:focus {
            border: 2px solid #1d5c97;
        }

        .input-contenedor input::placeholder {
            color: #999;
        }
        .ojo {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);

            font-size: 25px;
            color: #0b3c70;

            cursor: pointer;
            user-select: none;
        }

        /* Botón */

        .btn-login {
            display: block;

            width: 353px;
            height: 68px;

            margin: 67px auto 0;

            background-color: #205895;
            color: white;

            border: none;
            border-radius: 12px;

            font-size: 27px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .btn-login:hover {
            background-color: #174a80;
        }

        /* Crear cuenta */

        .crear {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 60px;

            margin-top: 68px;
        }
        .crear .pregunta {
            font-size: 24px;
            font-weight: bold;
            color: #555;
        }
        .crear a {
            font-size: 23px;
            color: #0b3c70;
            text-decoration: none;
        }
        .crear a:hover {
            text-decoration: underline;
        }
        @media (max-width: 900px) {

            .contenedor {
                flex-direction: column;
                overflow-y: auto;
            }

            .imagen {
                display: none;
            }

            .login {
                width: 100%;
                min-height: 100vh;
                padding: 80px 25px;
            }

            .logo {
                margin-bottom: 60px;
            }

            .formulario {
                max-width: 600px;
            }

            .btn-login {
                width: 100%;
            }

            .crear {
                gap: 20px;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <!-- IMAGEN -->
        <div class="imagen"></div>
        <!-- LOGIN -->
        <div class="login">

            <!-- LOGO -->
            <div class="logo">
                Vibe<span>PC</span>
            </div>
            <div class="formulario">
                <!-- CORREO -->
                <div class="grupo">
                    <label for="correo">
                        Correo electrónico
                    </label>

                    <div class="input-contenedor">
                        <input
                            type="email"
                            id="correo"
                            placeholder="ejemplo@gmail.com"
                        >
                    </div>
                </div>
                <!-- CONTRASEÑA -->
                <div class="grupo">
                    <label for="password">
                        Contraseña
                    </label>
                    <div class="input-contenedor">
                        <input
                            type="password"
                            id="password"
                            placeholder="Mínimo 8 caracteres"
                        >
                        <span
                            class="ojo"
                            onclick="mostrarPassword()"
                            id="ojo"
                        >
                            ◉
                        </span>

                    </div>
                </div>
                <!-- BOTÓN -->
                <button
                    class="btn-login"
                    onclick="iniciarSesion()"
                >
                    Iniciar Sesion
                </button>
                <!-- CREAR CUENTA -->
                <div class="crear">
                    <div class="pregunta">
                        ¿No tienes una cuenta?
                    </div>
                    <a href="principal.html">
                        
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script>
        function mostrarPassword() {
            const password = document.getElementById("password");
            const ojo = document.getElementById("ojo");
            if (password.type === "password") {
                password.type = "text";
                ojo.textContent = "◉";
            } else {
                password.type = "password";
                ojo.textContent = "◉";
            }
        }
        function iniciarSesion() {
            const correo = document.getElementById("correo").value;
            const password = document.getElementById("password").value;
            if (correo === "" || password === "") {
                alert("Por favor completa todos los campos.");
                return;
            }
            if (password.length < 8) {
                alert("La contraseña debe tener mínimo 8 caracteres.");
                return;
            }
            alert("Inicio de sesión correcto.");
        }
    </script>
</body>
</html>
