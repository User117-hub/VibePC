<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VibePC - Registro</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="contenedor">

        <!-- IMAGEN -->
        <div class="imagen"></div>

        <!-- REGISTRO -->
        <div class="registro">

            <!-- LOGO -->
            <div class="logo">
                Vibe<span>PC</span>
            </div>

            <div class="formulario">

                <h2>Crear cuenta</h2>

                <!-- NOMBRE -->
                <div class="grupo">

                    <label for="nombre">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        placeholder="Ingresa tu nombre"
                    >

                </div>


                <!-- CORREO -->
                <div class="grupo">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="ejemplo@gmail.com"
                    >

                </div>


                <!-- CONTRASEÑA -->
                <div class="grupo">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-contenedor">

                        <input
                            type="password"
                            id="password"
                            placeholder="Mínimo 8 caracteres"
                        >

                        <span
                            class="ojo"
                            onclick="mostrarPassword()">
                            ◉
                        </span>

                    </div>

                </div>


                <!-- CONFIRMAR CONTRASEÑA -->
                <div class="grupo">

                    <label for="confirmar">
                        Confirmar contraseña
                    </label>

                    <div class="input-contenedor">

                        <input
                            type="password"
                            id="confirmar"
                            placeholder="Repite tu contraseña"
                        >

                        <span
                            class="ojo"
                            onclick="mostrarConfirmarPassword()">
                            ◉
                        </span>
                    </div>
                </div>
                <button
                    class="btn-registro"
                    onclick="registrarUsuario()">
                    Registrarse
                    <a href="login.html">
                </button>
                <div class="iniciar">

                    <p>¿Ya tienes una cuenta?</p>

                    <a href="login.html">
                        Inicia sesión
                    </a>

                </div>

            </div>

        </div>

    </div>
    <script src="js/registro.js"></script>
</body>
</html>
