<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibePC - Registro</title>
    <link rel="stylesheet" href="css/registro.css">
</head>

<body>
    <section class="contenedor">

        <section class="imagen"></section>

        <section class="registro">

            <h1 class="logo">Vibe<span>PC</span></h1>

            <section class="formulario">

                <h2>Crear cuenta</h2>

                <article class="grupo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" placeholder="Ingresa tu nombre">
                </article>

                <article class="grupo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" placeholder="ejemplo@gmail.com">
                </article>

                <article class="grupo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 8 caracteres">
                </article>

                <article class="grupo">
                    <label for="confirmar">Confirmar contraseña</label>
                    <input type="password" id="confirmar" placeholder="Repite tu contraseña">
                </article>

                <a href="login.html" class="btn-registro">Registrarse</a>

                <article class="iniciar">
                    <p>¿Ya tienes una cuenta?</p>
                    <a href="login.html">Inicia sesión</a>
                </article>

            </section>
        </section>
    </section>
</body>
</html>
