<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibePC - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="contenedor">

        <!-- IMAGEN -->
        <div class="imagen"></div>

        <!-- LOGIN -->
        <div class="login">

            <!-- LOGO -->
            <div class="logo">
                Vibe<span>PC</span>
            </div>

            <div class="formulario">

                <!-- CORREO -->
                <div class="grupo">
                    <label for="correo">
                        Correo electrónico
                    </label>

                    <div class="input-contenedor">
                        <input
                            type="email"
                            id="correo"
                            placeholder="ejemplo@gmail.com"
                            required
                        >
                    </div>
                </div>

                <!-- CONTRASEÑA -->
                <div class="grupo">
                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-contenedor">
                        <input
                            type="password"
                            id="password"
                            placeholder="Mínimo 8 caracteres"
                            required
                        >

                        <span
                            class="ojo"
                            id="ojo"
                            onclick="mostrarPassword()"
                        >
                            ◉
                        </span>
                    </div>
                </div>

                <!-- BOTÓN -->
                <button class="btn-login" onclick="iniciarSesion()">
                    <a href="index.html"
                    Iniciar Sesión
                </button>

                <!-- CREAR CUENTA -->
                <div class="crear">
                    <div class="pregunta">
                        ¿No tienes una cuenta?
                    </div>

                    <a href="registro.html">Regístrate</a>
                </div>

            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="js/login.js"></script>
</body>
</html>
