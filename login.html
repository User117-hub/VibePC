<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibePC - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <section class="contenedor">

        <section class="imagen"></section>

        <section class="login">

            <h1 class="logo">Vibe<span>PC</span></h1>

            <section class="formulario">

                <article class="grupo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" placeholder="ejemplo@gmail.com" required>
                </article>

                <article class="grupo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
                </article>

                <a href="index.html" class="btn-login">Iniciar Sesión</a>

                <article class="crear">
                    <p>¿No tienes una cuenta?</p>
                    <a href="registro.html">Regístrate</a>
                </article>

            </section>
        </section>
    </section>
</body>
</html>
